<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แคตตาล็อกสินค้า Chern9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1f1c;--muted:#6b726e;--line:#e3e6e4;--bg:#f6f7f6;--card:#fff;--accent:#11634F;--accent-soft:#e3f1ec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,system-ui,sans-serif;font-size:14px}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar h1{font-size:17px;margin:0 8px 0 0}
.bar input[type=search]{flex:1;min-width:180px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
.bar select{padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.bar label{display:flex;gap:4px;align-items:center;color:var(--muted)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.count{color:var(--muted);font-size:13px}
main{max-width:1100px;margin:0 auto;padding:12px 16px 40px}
.cover{display:none}
h2.grp{font-size:20px;margin:22px 0 6px;padding-bottom:4px;border-bottom:3px solid var(--accent)}
h3.brand{font-size:15px;margin:14px 0 8px;color:var(--accent);display:flex;gap:8px;align-items:baseline}
h2.grp .sub2{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
h3.brand span{color:var(--muted);font-weight:400;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;break-inside:avoid}
.ph{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:contain}
.ph .no{color:#b8bdba;font-size:12px}
.info{padding:7px 9px 9px;display:flex;flex-direction:column;gap:3px}
.nm{font-weight:600;font-size:13px;line-height:1.3}
.code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 5px;align-self:flex-start}
.u{font-size:11px;color:var(--muted);line-height:1.35}
.u b{color:var(--ink);font-weight:600}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff;font-size:10pt}
  .bar{display:none}
  main{max-width:none;padding:0}
  .cover{display:block;text-align:center;padding:60mm 0 0;break-after:page}
  .cover h1{font-size:30pt;margin:0 0 6mm}
  .cover p{color:var(--muted);font-size:12pt;margin:2mm 0}
  h2.grp{break-before:page;margin-top:0}
  h2.grp:first-of-type{break-before:auto}
  h3.brand{break-after:avoid}
  .grid{grid-template-columns:repeat(5,1fr);gap:2.5mm}
  .card{border-radius:2mm}
  .nm{font-size:8.5pt}.u{font-size:7.5pt}.code{font-size:7pt}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="bar">
  <h1>แคตตาล็อกสินค้า</h1>
  <input id="q" type="search" placeholder="ค้นหา ชื่อ / รหัส / แบรนด์ / บาร์โค้ด">
  <select id="co"><option value="">ทุกบริษัท</option></select>
  <select id="g"><option value="">ทุกหมวด</option></select>
  <select id="b"><option value="">ทุกแบรนด์</option></select>
  <label><input type="checkbox" id="onlyImg"> เฉพาะที่มีรูป</label>
  <label><input type="checkbox" id="showBar" checked> แสดงบาร์โค้ด</label>
  <span class="count" id="cnt"></span>
  <button class="btn" id="pdf" type="button">บันทึกเป็น PDF</button>
</div>
<main>
  <div class="cover"><h1>แคตตาล็อกสินค้า</h1><p id="covSub"></p><p id="covDate"></p></div>
  <div id="out"></div>
</main>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=D.map(([c,n,g,s,br,img,us,co],i)=>({i,c,n,g,s,br,img,us,co,key:(c+' '+n+' '+br+' '+co+' '+us.map(u=>u[2]).join(' ')).toLowerCase()}));
const NOCO='ไม่ระบุบริษัท';
const coCount=new Map();P.forEach(p=>coCount.set(p.co,(coCount.get(p.co)||0)+1));
const COS=[...coCount.keys()].sort((a,b)=>(a===NOCO)-(b===NOCO)||a.localeCompare(b,'th'));
const coRank=new Map(COS.map((c,i)=>[c,i]));
const brFirst=new Map();P.forEach(p=>{const k=p.co+'|'+p.br.toLowerCase();if(!brFirst.has(k))brFirst.set(k,p.i)});
const groups=[...new Set(P.map(p=>p.g))];
const brandKey=b=>b.toLowerCase().replace(/\s+/g,' ');
groups.forEach(g=>$('g').insertAdjacentHTML('beforeend','<option>'+esc(g)+'</option>'));
COS.forEach(c=>$('co').insertAdjacentHTML('beforeend','<option>'+esc(c)+'</option>'));
function $(id){return document.getElementById(id)}
function fillBrands(){const g=$('g').value,co=$('co').value;const m=new Map();P.filter(p=>(!g||p.g===g)&&(!co||p.co===co)).forEach(p=>{const k=brandKey(p.br);if(!m.has(k))m.set(k,p.br)});
  const cur=$('b').value;$('b').innerHTML='<option value="">ทุกแบรนด์</option>'+[...m].sort((a,b)=>a[1].localeCompare(b[1],'th')).map(([k,v])=>'<option value="'+esc(k)+'">'+esc(v)+'</option>').join('');
  if([...m.keys()].includes(cur))$('b').value=cur}
function imgErr(i){const m=i.src.match(/lh3\.googleusercontent\.com\/d\/([^=]+)/);if(m&&!i.dataset.r){i.dataset.r=1;i.src='https://drive.google.com/thumbnail?id='+m[1]+'&sz=w400';return}i.replaceWith(Object.assign(document.createElement('span'),{className:'no',textContent:'ไม่มีรูป'}))}
function units(p){const sb=$('showBar').checked;return p.us.map((u,i)=>'<div class="u"><b>'+esc(u[0])+'</b>'+(i?' = '+u[1]+' '+esc(p.us[0][0]):'')+(sb&&u[2]?' · '+esc(u[2]):'')+'</div>').join('')}
function render(){
  const q=$('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean),g=$('g').value,b=$('b').value,co=$('co').value,oi=$('onlyImg').checked;
  const L=P.filter(p=>(!co||p.co===co)&&(!g||p.g===g)&&(!b||brandKey(p.br)===b)&&(!oi||p.img)&&q.every(t=>p.key.includes(t)))
    .sort((a,b)=>coRank.get(a.co)-coRank.get(b.co)||brFirst.get(a.co+'|'+a.br.toLowerCase())-brFirst.get(b.co+'|'+b.br.toLowerCase())||a.i-b.i);
  $('cnt').textContent=L.length.toLocaleString('th-TH')+' รายการ · มีรูป '+L.filter(p=>p.img).length.toLocaleString('th-TH');
  let h='',cc=null,cb=null,open=false;
  const close=()=>{if(open){h+='</div>';open=false}};
  for(const p of L){
    if(p.co!==cc){close();cc=p.co;cb=null;h+='<h2 class="grp">'+esc(cc)+'<span class="sub2">'+L.filter(x=>x.co===cc).length+' รายการ</span></h2>'}
    if(brandKey(p.br)!==cb){close();cb=brandKey(p.br);const n=L.filter(x=>x.co===cc&&brandKey(x.br)===cb).length;h+='<h3 class="brand">'+esc(p.br||'อื่นๆ')+'<span>'+n+' รายการ</span></h3><div class="grid">';open=true}
    h+='<div class="card"><div class="ph">'+(p.img?'<img src="'+esc(p.img)+'" alt="" referrerpolicy="no-referrer" onerror="imgErr(this)">':'<span class="no">ไม่มีรูป</span>')+'</div>'+
      '<div class="info"><span class="code">'+esc(p.c)+'</span><div class="nm">'+esc(p.n)+'</div>'+units(p)+'</div></div>';
  }
  close();
  $('out').innerHTML=h||'<div class="empty">ไม่พบสินค้า</div>';
  $('covSub').textContent=(co||'ทุกบริษัท')+(g?' · '+g:'')+(b?' · '+$('b').selectedOptions[0].text:'')+' · '+L.length.toLocaleString('th-TH')+' รายการ';
}
$('covDate').textContent='อัปเดต '+new Date().toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});
let t;$('q').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(render,150)});
$('g').addEventListener('change',()=>{fillBrands();render()});
$('co').addEventListener('change',()=>{fillBrands();render()});
['b','onlyImg','showBar'].forEach(id=>$(id).addEventListener('change',render));
$('pdf').addEventListener('click',async()=>{
  const btn=$('pdf');btn.disabled=true;btn.textContent='กำลังโหลดรูป…';
  const imgs=[...document.images];await Promise.race([Promise.all(imgs.map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r}))),new Promise(r=>setTimeout(r,20000))]);
  btn.disabled=false;btn.textContent='บันทึกเป็น PDF';window.print();
});
fillBrands();render();
</script>
